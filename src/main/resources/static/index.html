<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Currency Converter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .converter {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        /* Added spacing between form elements */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group-input {
            margin-right: 25px;
            margin-bottom: 10px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }

        /* Updated button styling for better appearance */
        .gradient-btn {
            display: block;
            margin: 20px auto; /* Increased top and bottom margin for spacing */
            outline: 0;
            border: 0;
            background-image: linear-gradient(to right, #e052a0, #f15c41);
            cursor: pointer;
            border-radius: 20px; /* Made button more rounded */
            color: #fff;
            font-weight: 500;
            text-align: center;
            text-transform: uppercase;
            height: 40px; /* Increased height for better visibility */
            line-height: 40px;
            padding: 0 20px; /* Increased horizontal padding */
            font-size: 16px; /* Increased font size */
            transition: background-image 0.3s ease;
            max-width: 200px;
        }

        .gradient-btn:hover {
            background-image: linear-gradient(to right, #3ec7e0, #526bf4);
        }

        #result {
            margin-top: 20px;
            text-align: center;
            font-size: 1.2rem;
            color: #222;
        }
    </style>
</head>
<body>
<div class="converter">
    <h2>Currency Converter</h2>

    <!-- Wrapped input and selects in form-group divs for spacing -->
    <div class="form-group, form-group-input">
        <input type="number" id="amount" placeholder="Enter amount" />
    </div>

    <div class="form-group">
        <select id="from">
            <option value="INR">INR - Indian Rupee</option>
            <option value="USD">USD - United States Dollar</option>
            <option value="EUR">EUR - Euro</option>
            <option value="CNY">CNY - Chinese Renminbi</option>
            <option value="JPY">JPY - Japanese Yen</option>
            <option value="SAR">SAR - Saudi Riyal</option>
        </select>
    </div>

    <div class="form-group">
        <select id="to">
            <option value="USD">USD - United States Dollar</option>
            <option value="INR">INR - Indian Rupee</option>
            <option value="EUR">EUR - Euro</option>
            <option value="CNY">CNY - Chinese Renminbi</option>
            <option value="JPY">JPY - Japanese Yen</option>
            <option value="SAR">SAR - Saudi Riyal</option>
        </select>
    </div>

    <button class="gradient-btn" onclick="convertCurrency()">Convert</button>

    <div id="result"></div>
</div>

<script>
    function convertCurrency() {
        const amount = parseFloat(document.getElementById("amount").value);
        const from = document.getElementById("from").value;
        const to = document.getElementById("to").value;

        if (!amount || amount <= 0) {
            document.getElementById("result").textContent = "Please enter a valid amount.";
            return;
        }

        fetch("/api/currency/convert", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ amount, from, to })
        })
            .then(res => res.json())
            .then(data => {
                document.getElementById("result").textContent =
                    `Converted: ${data.convertedAmount.toFixed(2)} ${to}`;
            })
            .catch(err => {
                console.error(err);
                document.getElementById("result").textContent = "Conversion failed. Try again.";
            });
    }
</script>
</body>
</html>
